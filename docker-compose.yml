version: "3.8"
services:
  dicom:
    image: registry.dto.kemkes.go.id/pub/dicom-router:latest
    container_name: dicom-router
    restart: always
    ports:
      - "11112:11112"
      - "8080:8080"
    environment:
      - ORG_ID=<replace with values>
      - CLIENT=<replace with values>
      - SECRET=<replace with values>
      - URL=https://api-satusehat.kemkes.go.id
    networks:
      - dicom-network
networks:
  dicom-network:
    driver: bridge
